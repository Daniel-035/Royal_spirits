[build]
  command = "pnpm install && pnpm build --filter @royal-spirits/admin"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://royal-spirits-api.up.railway.app"
  VITE_EXCISE_LICENSE_NUMBER = "L-EXCISE-00000"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
