# Royal Spirits — Render infrastructure-as-code
# Docs: https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard → "New" → "Blueprint"
#
# Render auto-detects pnpm from pnpm-lock.yaml at the repo root — there is no
# "pnpm" runtime value. Node/pnpm versions are pinned via env vars below.

databases:
  - name: royal-spirits-db
    databaseName: royal_spirits
    user: royal_spirits
    plan: free
    postgresMajorVersion: "16"

services:
  # ─────────────────────────────────────────────
  # API (Express + Prisma)
  # ─────────────────────────────────────────────
  - type: web
    name: royal-spirits-api
    plan: free
    region: oregon
    rootDir: apps/api
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: PNPM_VERSION
        value: "10.12.4"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: royal-spirits-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: OTP_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: PORT
        value: "4000"
    buildCommand: cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm build --filter @royal-spirits/api
    startCommand: pnpm --filter @royal-spirits/api run db:deploy && pnpm --filter @royal-spirits/api start
    healthCheckPath: /api/v1/health

  # ─────────────────────────────────────────────
  # Customer storefront (Next.js)
  # ─────────────────────────────────────────────
  - type: web
    name: royal-spirits-customer
    plan: free
    region: oregon
    rootDir: apps/customer
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: PNPM_VERSION
        value: "10.12.4"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_EXCISE_LICENSE_NUMBER
        value: L-EXCISE-00000
    buildCommand: cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm build --filter @royal-spirits/customer
    startCommand: pnpm --filter @royal-spirits/customer start
    healthCheckPath: /

  # ─────────────────────────────────────────────
  # Admin panel (Vite SPA → static site)
  # ─────────────────────────────────────────────
  - type: web
    name: royal-spirits-admin
    runtime: static
    plan: free
    region: oregon
    rootDir: apps/admin
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: PNPM_VERSION
        value: "10.12.4"
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_EXCISE_LICENSE_NUMBER
        value: L-EXCISE-00000
    buildCommand: cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm build --filter @royal-spirits/admin
