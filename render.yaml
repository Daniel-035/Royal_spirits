# Royal Spirits — Render infrastructure-as-code
# Docs: https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard → "New" → "Blueprint"
#
# No rootDir: all services build from the repo root so Render detects
# pnpm-lock.yaml and uses pnpm (not npm) for the dependency install step.
# npm cannot resolve the `workspace:*` protocol in our package.json files.

databases:
  - name: royal-spirits-db
    databaseName: royal_spirits
    user: royal_spirits
    plan: free
    postgresMajorVersion: "16"

services:
  # ─────────────────────────────────────────────
  # API (Express + Prisma)
  # ─────────────────────────────────────────────
  - type: web
    name: royal-spirits-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --config.confirm-modules-purge=false && pnpm build --filter @royal-spirits/api
    startCommand: sh apps/api/scripts/deploy.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: royal-spirits-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: OTP_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: PORT
        value: "4000"

  # ─────────────────────────────────────────────
  # Customer storefront (Next.js)
  # ─────────────────────────────────────────────
  - type: web
    name: royal-spirits-customer
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile --config.confirm-modules-purge=false && pnpm build --filter @royal-spirits/customer
    startCommand: pnpm --filter @royal-spirits/customer start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_EXCISE_LICENSE_NUMBER
        value: L-EXCISE-00000

  # ─────────────────────────────────────────────
  # Admin panel (Vite SPA → static site)
  # ─────────────────────────────────────────────
  - type: web
    name: royal-spirits-admin
    runtime: static
    staticPublishPath: ./apps/admin/dist
    buildCommand: pnpm install --frozen-lockfile --config.confirm-modules-purge=false && pnpm build --filter @royal-spirits/admin
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_EXCISE_LICENSE_NUMBER
        value: L-EXCISE-00000
